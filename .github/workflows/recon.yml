name: Continuous Subdomain Recon

on:
  schedule:
    - cron: "0 */1 * * *"   # Every hour
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq unzip curl

          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Prepare Directories
        run: |
          mkdir -p db
          touch db/all_subs.txt
          touch db/domain_status.txt

      # =============================
      # 1️⃣ Subdomain Discovery
      # =============================
      - name: Run Subfinder
        run: |
          subfinder -d nasa.gov -silent > current_subs.txt

          echo "Raw discovered:"
          wc -l current_subs.txt

      # =============================
      # 2️⃣ DNS Resolution
      # =============================
      - name: Resolve with dnsx
        run: |
          if [ -s current_subs.txt ]; then
            dnsx -l current_subs.txt -silent -retry 2 -o resolved_subs.txt
          else
            touch resolved_subs.txt
          fi

          echo "Resolved domains:"
          wc -l resolved_subs.txt

      # =============================
      # 3️⃣ Detect New Subdomains
      # =============================
      - name: Compare New Subdomains
        id: compare
        run: |
          if [ ! -s db/all_subs.txt ]; then
            echo "FIRST_RUN=true" >> $GITHUB_ENV
          else
            echo "FIRST_RUN=false" >> $GITHUB_ENV
          fi

          grep -Fvxf db/all_subs.txt resolved_subs.txt > new_subs.txt || true

          if [ -s new_subs.txt ]; then
            COUNT=$(wc -l < new_subs.txt | xargs)
            echo "new_found=true" >> $GITHUB_OUTPUT
            echo "new_count=$COUNT" >> $GITHUB_OUTPUT

            cat new_subs.txt >> db/all_subs.txt
            sort -u db/all_subs.txt -o db/all_subs.txt
          else
            echo "new_found=false" >> $GITHUB_OUTPUT
            echo "new_count=0" >> $GITHUB_OUTPUT
          fi

      # =============================
      # 4️⃣ HTTP Status Check
      # =============================
      - name: Check HTTP Status (httpx)
        run: |
          if [ -s db/all_subs.txt ]; then
            httpx -l db/all_subs.txt -silent -status-code \
              -threads 100 -timeout 10 > current_status.txt
          else
            touch current_status.txt
          fi

          awk '{gsub(/\[|\]/,"",$2); print $1"|"$2}' current_status.txt \
            | sort -u > formatted_status.txt

      # =============================
      # 5️⃣ Detect Status Changes
      # =============================
      - name: Detect Status Changes
        id: status
        run: |
          if [ ! -s db/domain_status.txt ]; then
            echo "FIRST_STATUS_RUN=true" >> $GITHUB_ENV
          else
            echo "FIRST_STATUS_RUN=false" >> $GITHUB_ENV
          fi

          grep -Fvxf db/domain_status.txt formatted_status.txt > status_changes.txt || true

          if [ -s status_changes.txt ]; then
            COUNT=$(wc -l < status_changes.txt | xargs)
            echo "status_changed=true" >> $GITHUB_OUTPUT
            echo "status_count=$COUNT" >> $GITHUB_OUTPUT

            cat formatted_status.txt > db/domain_status.txt
          else
            echo "status_changed=false" >> $GITHUB_OUTPUT
            echo "status_count=0" >> $GITHUB_OUTPUT
          fi

      # =============================
      # 6️⃣ Slack Alert
      # =============================
      - name: Upload New Subs to Slack
        if: steps.compare.outputs.new_found == 'true' && env.FIRST_RUN == 'false'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: files.uploadV2
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel_id": "C0A5M7P61N3",
              "initial_comment": "🎯 New subdomains discovered (Total: ${{ steps.compare.outputs.new_count }})",
              "file": "./new_subs.txt",
              "filename": "new_subdomains.txt"
            }

      - name: Upload Status Changes to Slack
        if: steps.status.outputs.status_changed == 'true' && env.FIRST_STATUS_RUN == 'false'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: files.uploadV2
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel_id": "C0A5M7P61N3",
              "initial_comment": "⚡ HTTP Status Changes Detected (Total: ${{ steps.status.outputs.status_count }})",
              "file": "./status_changes.txt",
              "filename": "status_changes.txt"
            }

      # =============================
      # 7️⃣ Commit Changes
      # =============================
      - name: Commit and Push Changes
        if: steps.compare.outputs.new_found == 'true' || steps.status.outputs.status_changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add db/all_subs.txt db/domain_status.txt
          git diff --cached --quiet || git commit -m "Recon Update: $(date +'%Y-%m-%d %H:%M')"
          git push origin main

      # =============================
      # 8️⃣ Cleanup
      # =============================
      - name: Cleanup
        if: always()
        run: |
          rm -f current_subs.txt resolved_subs.txt new_subs.txt
          rm -f current_status.txt formatted_status.txt status_changes.txt
