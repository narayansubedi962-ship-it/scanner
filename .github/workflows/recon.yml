name: Continuous Subdomain Recon

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq curl
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/tomnomnom/anew@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Prepare
        run: |
          mkdir -p db sub_recon
          touch db/subdomains.txt
          touch db/domain_health.txt

      - name: Discover Subdomains
        run: |
          if [ ! -f db/targets.txt ]; then
            echo "❌ db/targets.txt not found"
            exit 0
          fi

          > sub_recon/all_sources.txt

          while read domain; do
            domain=$(echo "$domain" | tr -d '\r')
            [ -z "$domain" ] && continue

            echo "🔍 Recon: $domain"

            # crt.sh (fixed JSON handling)
            curl -s "https://crt.sh/?q=%25.${domain}&output=json" \
              | tr -d '\n' \
              | sed 's/}{/}\n{/g' \
              | jq -r '.name_value' 2>/dev/null \
              | sed 's/\*\.//g' >> sub_recon/all_sources.txt || true

            # THC sb
            curl -s "https://ip.thc.org/sb/${domain}" \
              | grep -Eo "([a-zA-Z0-9._-]+\.)+${domain}" >> sub_recon/all_sources.txt || true

            # THC cn
            curl -s "https://ip.thc.org/cn/${domain}" \
              | grep -Eo "([a-zA-Z0-9._-]+\.)+${domain}" >> sub_recon/all_sources.txt || true

            # Subfinder
            subfinder -d "$domain" -silent >> sub_recon/all_sources.txt || true

          done < db/targets.txt

          cat sub_recon/all_sources.txt \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/\.$//' \
            | grep -Eo '^([a-zA-Z0-9._-]+\.)+[a-zA-Z]{2,}$' \
            | sort -u > sub_recon/subs_raw.txt

          echo "📊 Raw Subdomains:"
          wc -l sub_recon/subs_raw.txt

      - name: DNS Resolution
        run: |
          if [ -s sub_recon/subs_raw.txt ]; then
            dnsx -l sub_recon/subs_raw.txt -silent -retry 3 -threads 200 \
              -o sub_recon/subs_resolved.txt
          else
            touch sub_recon/subs_resolved.txt
          fi

          echo "📊 Resolved Subdomains:"
          wc -l sub_recon/subs_resolved.txt

      - name: Save New Subdomains
        id: newsubs
        run: |
          anew db/subdomains.txt < sub_recon/subs_resolved.txt > sub_recon/new.txt || true

          COUNT=$(wc -l < sub_recon/new.txt | xargs)
          echo "New subs: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "count=$COUNT" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      - name: HTTP Probe
        run: |
          if [ -s sub_recon/subs_resolved.txt ]; then
            httpx -l sub_recon/subs_resolved.txt \
              -silent -status-code -threads 200 -timeout 10 \
              > sub_recon/http.txt
          else
            touch sub_recon/http.txt
          fi

          awk '{gsub(/\[|\]/,"",$2); print $1"|"$2}' sub_recon/http.txt \
            | sort -u > sub_recon/current_health.txt

      - name: Detect Status Changes
        id: health
        run: |
          anew db/domain_health.txt < sub_recon/current_health.txt > sub_recon/changes.txt || true

          COUNT=$(wc -l < sub_recon/changes.txt | xargs)
          echo "Status changes: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "count=$COUNT" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      - name: Slack Notification
        if: steps.newsubs.outputs.found == 'true' || steps.health.outputs.changed == 'true'
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0A5M7P61N3",
              "text": "🚀 Recon Update\nNew Subs: ${{ steps.newsubs.outputs.count }}\nStatus Changes: ${{ steps.health.outputs.count }}"
            }

      - name: Commit Changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add db/subdomains.txt db/domain_health.txt
          git diff --cached --quiet || git commit -m "Recon Update $(date -u)"
          git push
