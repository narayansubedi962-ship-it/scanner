name: Continuous Subdomain Recon

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq unzip
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/tomnomnom/anew@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Prepare Directories
        run: |
          mkdir -p db sub_recon
          touch db/subdomains.txt db/domain_health.txt

      - name: Passive Subdomain Discovery
        run: |
          if [ ! -f targets.txt ]; then
            echo "Error: targets.txt not found!"
            exit 1
          fi

          TMP_DIR=$(mktemp -d)
          : > "$TMP_DIR/crt.txt"
          : > "$TMP_DIR/thc.txt"
          : > "$TMP_DIR/subfinder.txt"

          while IFS= read -r domain || [ -n "$domain" ]; do
            [ -z "$domain" ] && continue
            
            # crt.sh
            curl -s --max-time 40 "https://crt.sh/?q=%25.${domain}&output=json" \
              | jq -r '.[].name_value' 2>/dev/null | sed 's/\*\.//g' >> "$TMP_DIR/crt.txt" || true

            # THC
            curl -s --max-time 30 "https://ip.thc.org/sb/${domain}" \
              | grep -Eo "([a-zA-Z0-9._-]+\.)+${domain}" >> "$TMP_DIR/thc.txt" || true
            
            # Subfinder
            subfinder -d "$domain" -silent >> "$TMP_DIR/subfinder.txt" || true
          done < targets.txt

          cat "$TMP_DIR"/*.txt 2>/dev/null \
            | tr '[:upper:]' '[:lower:]' | sed 's/\.$//' \
            | grep -Eo '^([a-zA-Z0-9._-]+\.)+[a-zA-Z]{2,}$' \
            | sort -u > sub_recon/subs_raw.txt

      - name: DNS Resolution
        run: |
          dnsx -l sub_recon/subs_raw.txt -silent -c 200 -o sub_recon/subs_resolved.txt || true

      - name: Detect New Subdomains
        id: newsubs
        run: |
          anew db/subdomains.txt < sub_recon/subs_resolved.txt > sub_recon/new_subs.txt
          if [ -s sub_recon/new_subs.txt ]; then
            COUNT=$(wc -l < sub_recon/new_subs.txt | xargs)
            echo "found=true" >> $GITHUB_OUTPUT
            echo "count=$COUNT" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      - name: HTTP Status Probe
        run: |
          httpx -l sub_recon/subs_resolved.txt -status-code -silent -no-color > sub_recon/health_raw.txt || true
          awk '{gsub(/\[|\]/, "", $2); print $1"|"$2}' sub_recon/health_raw.txt | sort -u > sub_recon/current_health.txt

      - name: Detect Status Changes
        id: health
        run: |
          anew db/domain_health.txt < sub_recon/current_health.txt > sub_recon/health_changes.txt
          if [ -s sub_recon/health_changes.txt ]; then
            COUNT=$(wc -l < sub_recon/health_changes.txt | xargs)
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "count=$COUNT" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      - name: Slack Notification
        if: steps.newsubs.outputs.found == 'true' || steps.health.outputs.changed == 'true'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0A5M7P61N3",
              "text": "🚀 *Recon Update Found*\n• New Subdomains: ${{ steps.newsubs.outputs.count }}\n• Status Changes: ${{ steps.health.outputs.count }}"
            }

      - name: Commit Changes
        if: steps.newsubs.outputs.found == 'true' || steps.health.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add db/subdomains.txt db/domain_health.txt
          git commit -m "Recon Update $(date -u +'%Y-%m-%d %H:%M UTC')" || exit 0
          git push origin main
