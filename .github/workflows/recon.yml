name: Continuous Subdomain Recon
on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install Tools
        run: |
          # ✅ Fix #1 — install jq, unzip, curl before anything uses them
          sudo apt-get update -qq
          sudo apt-get install -y jq unzip curl

          # --- subfinder (latest binary) ---
          SF_VER=$(curl -sf https://api.github.com/repos/projectdiscovery/subfinder/releases/latest \
            | jq -r '.tag_name' | sed 's/v//')
          curl -sL "https://github.com/projectdiscovery/subfinder/releases/download/v${SF_VER}/subfinder_${SF_VER}_linux_amd64.zip" \
            -o /tmp/subfinder.zip
          unzip -oq /tmp/subfinder.zip -d /tmp/sf
          sudo mv /tmp/sf/subfinder /usr/local/bin/subfinder
          rm -rf /tmp/subfinder.zip /tmp/sf

          # --- dnsx (latest binary) ---
          DX_VER=$(curl -sf https://api.github.com/repos/projectdiscovery/dnsx/releases/latest \
            | jq -r '.tag_name' | sed 's/v//')
          curl -sL "https://github.com/projectdiscovery/dnsx/releases/download/v${DX_VER}/dnsx_${DX_VER}_linux_amd64.zip" \
            -o /tmp/dnsx.zip
          unzip -oq /tmp/dnsx.zip -d /tmp/dx
          sudo mv /tmp/dx/dnsx /usr/local/bin/dnsx
          rm -rf /tmp/dnsx.zip /tmp/dx

          # --- httpx (latest binary) ---
          HX_VER=$(curl -sf https://api.github.com/repos/projectdiscovery/httpx/releases/latest \
            | jq -r '.tag_name' | sed 's/v//')
          curl -sL "https://github.com/projectdiscovery/httpx/releases/download/v${HX_VER}/httpx_${HX_VER}_linux_amd64.zip" \
            -o /tmp/httpx.zip
          unzip -oq /tmp/httpx.zip -d /tmp/hx
          sudo mv /tmp/hx/httpx /usr/local/bin/httpx
          rm -rf /tmp/httpx.zip /tmp/hx

          # --- anew ---
          go install github.com/tomnomnom/anew@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

          # verify installs
          subfinder -version 2>&1 | head -1
          dnsx    -version 2>&1 | head -1
          httpx   -version 2>&1 | head -1
          jq      --version

      - name: Prepare Workspace
        run: |
          mkdir -p sub_recon db
          touch db/all_subs.txt db/domain_health.txt

      - name: Discover Subdomains
        run: |
          TARGET="nasa.gov"
          > sub_recon/all_sources.txt

          echo "[*] subfinder..."
          subfinder -d "$TARGET" -silent >> sub_recon/all_sources.txt || true

          echo "[*] crt.sh..."
          curl -sf --retry 3 --max-time 30 \
            "https://crt.sh/?q=%25.${TARGET}&output=json" \
            | jq -r '.[].name_value' 2>/dev/null \
            | sed 's/\*\.//g' \
            >> sub_recon/all_sources.txt || true

          echo "[*] THC /sb..."
          curl -sf --retry 2 --max-time 20 \
            "https://ip.thc.org/sb/${TARGET}" \
            | grep -Eo "([a-zA-Z0-9._-]+\.)+${TARGET}" \
            >> sub_recon/all_sources.txt || true

          echo "[*] THC /cn..."
          curl -sf --retry 2 --max-time 20 \
            "https://ip.thc.org/cn/${TARGET}" \
            | grep -Eo "([a-zA-Z0-9._-]+\.)+${TARGET}" \
            >> sub_recon/all_sources.txt || true

          # Normalize: strip wildcards, lowercase, remove blanks/junk, dedup
          sed 's/\*\.//g' sub_recon/all_sources.txt \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/\.$//; s/[[:space:]]//g' \
            | grep -E '^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$' \
            | sort -u > sub_recon/subs_raw.txt

          echo "Raw unique count: $(wc -l < sub_recon/subs_raw.txt)"

      - name: DNS Resolve (dnsx)
        run: |
          if [ -s sub_recon/subs_raw.txt ]; then
            dnsx -l sub_recon/subs_raw.txt \
              -silent -retry 3 \
              -o sub_recon/subs_resolved.txt
          else
            touch sub_recon/subs_resolved.txt
          fi
          echo "Resolved count: $(wc -l < sub_recon/subs_resolved.txt)"

      - name: Detect New Subdomains
        id: new_subs
        run: |
          if [ ! -s db/all_subs.txt ]; then
            echo "IS_FIRST_RUN=true" >> $GITHUB_ENV
          else
            echo "IS_FIRST_RUN=false" >> $GITHUB_ENV
          fi

          anew db/all_subs.txt < sub_recon/subs_resolved.txt \
            > sub_recon/new_subs.txt || true

          if [ -s sub_recon/new_subs.txt ]; then
            COUNT=$(wc -l < sub_recon/new_subs.txt | xargs)
            echo "new_found=true"   >> $GITHUB_OUTPUT
            echo "new_count=$COUNT" >> $GITHUB_OUTPUT
            echo "--- New subdomains ---"
            cat sub_recon/new_subs.txt
          else
            echo "new_found=false" >> $GITHUB_OUTPUT
            echo "new_count=0"     >> $GITHUB_OUTPUT
            echo "No new subdomains."
          fi

      - name: Probe HTTP Status (httpx)
        run: |
          if [ -s sub_recon/subs_resolved.txt ]; then
            httpx -l sub_recon/subs_resolved.txt \
              -silent -status-code \
              -threads 100 -timeout 10 \
              > sub_recon/http_raw.txt
          else
            touch sub_recon/http_raw.txt
          fi

          # Normalize: "https://host.com [200]" → "https://host.com|200"
          sed 's/ \[/|/; s/\]//' sub_recon/http_raw.txt \
            | sort -u > sub_recon/current_health.txt

          echo "HTTP-alive count: $(wc -l < sub_recon/current_health.txt)"

      - name: Detect HTTP Status Changes
        id: health_changes
        run: |
          # ✅ Fix #2 — proper change detection (not just anew)
          # ✅ Fix #3 — first-run guard lives here, not in the if: condition
          if [ ! -s db/domain_health.txt ]; then
            echo "First run — seeding health baseline, skipping alert."
            cp sub_recon/current_health.txt db/domain_health.txt
            echo "changes_found=false" >> $GITHUB_OUTPUT
            echo "changes_count=0"     >> $GITHUB_OUTPUT
            exit 0
          fi

          # Lines in current that are not in the baseline = new or changed entries
          grep -Fvxf db/domain_health.txt sub_recon/current_health.txt \
            > sub_recon/health_changes.txt || true

          if [ -s sub_recon/health_changes.txt ]; then
            COUNT=$(wc -l < sub_recon/health_changes.txt | xargs)
            echo "changes_found=true"   >> $GITHUB_OUTPUT
            echo "changes_count=$COUNT" >> $GITHUB_OUTPUT
            echo "--- Status changes ---"
            cat sub_recon/health_changes.txt
            # Overwrite baseline with latest snapshot
            cp sub_recon/current_health.txt db/domain_health.txt
          else
            echo "changes_found=false" >> $GITHUB_OUTPUT
            echo "changes_count=0"     >> $GITHUB_OUTPUT
            echo "No status changes."
          fi

      - name: Upload New Subdomains to Slack
        if: steps.new_subs.outputs.new_found == 'true' && env.IS_FIRST_RUN == 'false'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: files.uploadV2
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel_id": "C0A5M7P61N3",
              "initial_comment": "🎯 *New subdomains* for nasa.gov — ${{ steps.new_subs.outputs.new_count }} found",
              "file": "./sub_recon/new_subs.txt",
              "filename": "new_subdomains.txt"
            }

      - name: Upload HTTP Status Changes to Slack
        # ✅ Fix #3 — IS_FIRST_RUN guard removed; handled inside the step above
        if: steps.health_changes.outputs.changes_found == 'true'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: files.uploadV2
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel_id": "C0A5M7P61N3",
              "initial_comment": "🔄 *HTTP status changes* for nasa.gov — ${{ steps.health_changes.outputs.changes_count }} change(s)",
              "file": "./sub_recon/health_changes.txt",
              "filename": "http_status_changes.txt"
            }

      - name: Commit Persistent Stores
        if: steps.new_subs.outputs.new_found == 'true' || steps.health_changes.outputs.changes_found == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add db/all_subs.txt db/domain_health.txt
          git diff --cached --quiet || git commit -m \
            "recon: $(date -u '+%Y-%m-%d %H:%M UTC') | +${{ steps.new_subs.outputs.new_count }} subs | ${{ steps.health_changes.outputs.changes_count }} status changes"
          git push origin main

      - name: Cleanup Temporary Files
        if: always()
        run: |
          rm -f sub_recon/all_sources.txt \
                sub_recon/subs_raw.txt    \
                sub_recon/http_raw.txt    \
                sub_recon/new_subs.txt    \
                sub_recon/health_changes.txt
