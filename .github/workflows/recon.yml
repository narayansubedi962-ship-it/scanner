name: Continuous Subdomain Recon

on:
  schedule:
    - cron: "0 */2 * * *"  
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # --------------------------------------------------
      # Install Required Tools
      # --------------------------------------------------
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y jq unzip

          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/tomnomnom/anew@latest

          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # --------------------------------------------------
      # Prepare Structure
      # --------------------------------------------------
      - name: Prepare Directories
        run: |
          mkdir -p db sub_recon
          touch db/subdomains.txt
          touch db/domain_health.txt

      # --------------------------------------------------
      # Passive Subdomain Discovery (crt.sh + THC + subfinder)
      # --------------------------------------------------
      - name: Passive Subdomain Discovery
        run: |
          TMP_DIR=$(mktemp -d)
          echo "TMP_DIR=$TMP_DIR" >> $GITHUB_ENV

          > $TMP_DIR/crt.txt
          > $TMP_DIR/thc.txt
          > $TMP_DIR/subfinder.txt

          while read -r domain; do
            [ -z "$domain" ] && continue

            echo "🌐 crt.sh: $domain"
            curl -s --max-time 40 "https://crt.sh/?q=%25.${domain}&output=json" \
            | jq -r '.[].name_value' 2>/dev/null \
            | sed 's/\*\.//g' \
            >> $TMP_DIR/crt.txt || true

            echo "🌐 THC: $domain"
            curl -s --max-time 30 "https://ip.thc.org/sb/${domain}" \
            | grep -Eo "([a-zA-Z0-9._-]+\.)+${domain}" \
            >> $TMP_DIR/thc.txt || true

            curl -s --max-time 30 "https://ip.thc.org/cn/${domain}" \
            | grep -Eo "([a-zA-Z0-9._-]+\.)+${domain}" \
            >> $TMP_DIR/thc.txt || true

            echo "🌐 subfinder: $domain"
            subfinder -d "$domain" -silent >> $TMP_DIR/subfinder.txt

          done < targets.txt

          cat $TMP_DIR/*.txt 2>/dev/null \
          | tr '[:upper:]' '[:lower:]' \
          | sed 's/\.$//' \
          | grep -Eo '^([a-zA-Z0-9._-]+\.)+[a-zA-Z]{2,}$' \
          | sort -u \
          > sub_recon/subs_raw.txt

      # --------------------------------------------------
      # DNS Resolution
      # --------------------------------------------------
      - name: DNS Resolution
        run: |
          dnsx -l sub_recon/subs_raw.txt -silent -c 200 \
          -o sub_recon/subs_resolved.txt || true

      # --------------------------------------------------
      # New Subdomain Detection
      # --------------------------------------------------
      - name: Detect New Subdomains
        id: newsubs
        run: |
          cat sub_recon/subs_resolved.txt \
          | anew db/subdomains.txt \
          > sub_recon/new_subs.txt

          if [ -s sub_recon/new_subs.txt ]; then
            COUNT=$(wc -l < sub_recon/new_subs.txt | xargs)
            echo "found=true" >> $GITHUB_OUTPUT
            echo "count=$COUNT" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      # --------------------------------------------------
      # HTTP Status Probing
      # --------------------------------------------------
      - name: HTTP Status Probe
        run: |
          cat sub_recon/subs_resolved.txt \
          | httpx -http -https -status-code -silent -no-color \
          > sub_recon/health_raw.txt || true

          awk '{gsub(/\[|\]/,"",$2); print $1"|"$2}' \
          sub_recon/health_raw.txt \
          | sort -u \
          > sub_recon/current_health.txt

      # --------------------------------------------------
      # Status Code Change Detection
      # --------------------------------------------------
      - name: Detect Status Changes
        id: health
        run: |
          cat sub_recon/current_health.txt \
          | anew db/domain_health.txt \
          > sub_recon/health_changes.txt

          if [ -s sub_recon/health_changes.txt ]; then
            COUNT=$(wc -l < sub_recon/health_changes.txt | xargs)
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "count=$COUNT" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # --------------------------------------------------
      # Slack Alert
      # --------------------------------------------------
      - name: Slack Notification
        if: steps.newsubs.outputs.found == 'true' || steps.health.outputs.changed == 'true'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0A5M7P61N3",
              "text": "🚀 Recon Update\nNew Subs: ${{ steps.newsubs.outputs.count }}\nStatus Changes: ${{ steps.health.outputs.count }}"
            }

      # --------------------------------------------------
      # Commit Changes
      # --------------------------------------------------
      - name: Commit Changes
        if: steps.newsubs.outputs.found == 'true' || steps.health.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add db/subdomains.txt db/domain_health.txt
          git commit -m "Recon Update $(date +'%Y-%m-%d %H:%M')"
          git push origin main
